<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ff6b6b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>משחקי מגע לילדים</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <main class="hub">

    <nav class="game-grid" aria-label="רשימת משחקים">

        <span>חיות</span>
      </a>
      <a class="game-card game-card--cars" href="games/cars.html">

        <span>מכוניות</span>
      </a>
      <a class="game-card game-card--puzzles" href="games/puzzles.html">
        <span class="emoji" aria-hidden="true">🧩</span>
        <span>צורות</span>
      </a>
      <a class="game-card game-card--drawing" href="games/drawing.html">
        <span class="emoji" aria-hidden="true">🎨</span>
        <span>ציור</span>
      </a>

    <p class="hub-footer">לילדים בני 5–8 · ללא פרסומות</p>
